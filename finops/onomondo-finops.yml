meters:
- name: data_megabytes
  description: Cellular data transmitted by SIMs, billed per MB (starting at EUR 0.0025/MB).
  unit: megabytes
  aggregation: sum
  dimensions:
  - account
  - sim
  - tag
- name: sms_messages
  description: SMS messages sent to or from devices, metered per message.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - sim
- name: active_sims
  description: SIMs that transmitted data in the billing month (basis for any active-SIM charge).
  unit: sims
  aggregation: count
  dimensions:
  - account
  - tag
principles:
- name: Visibility
  description: Pull usage via the Usage API (per SIM and per Tag) and Traffic Monitor; inspect per-SIM and per-fleet data burn.
- name: Allocation
  description: Tag SIMs by device type, customer, or cost center; aggregate usage by Tag for chargeback.
- name: Optimization
  description: Set per-SIM data limits and cost-alert webhooks; use Network Lists to avoid expensive roaming; deactivate idle SIMs to avoid any active-SIM fees.
- name: Accountability
  description: Assign owners per Tag/fleet; review monthly data spend against budget and react to cost-alert events.
