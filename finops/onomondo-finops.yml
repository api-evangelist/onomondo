description: >-
  FinOps view of Onomondo IoT connectivity spend. Onomondo bills usage-based
  for cellular data transmitted by SIMs (starting at EUR 0.0025/MB on paid
  packages), with no active-SIM fee for SIMs that send no data in a month. SMS
  is metered per message. Package tier (Sandbox/Pro/Fleet/Enterprise) gates
  feature access rather than acting as a flat platform fee. Exact per-MB rates
  and any per-SIM charges are quote-based and not reconciled here.
notes: >-
  Per-MB data rates and any per-SIM monthly fees vary by package and committed
  volume; verify against the Onomondo pricing page during reconciliation.
