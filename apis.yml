name: Onomondo
kind: company
description: Onomondo is a global IoT cellular-connectivity platform that connects
  devices to 680+ networks across 180+ countries using a single core network. The
  Onomondo API (https://api.onomondo.com) provides programmatic management of SIMs,
  data usage, network lists, SMS, webhooks, connectors, and tags with Bearer API-key
  authentication.
